issuer: http://dex:5556/dex
storage:
  type: memory
web:
  http: 0.0.0.0:5556
oauth2:
  skipApprovalScreen: true
staticClients:
  - id: omni
    name: Omni
    secret: omni-oidc-secret
    redirectURIs:
      - https://localhost:8099/oidc/consume
      - https://omni:8099/oidc/consume
enablePasswordDB: true
staticPasswords:
  - email: "admin@example.com"
    # bcrypt hash of the login password; generate with: htpasswd -bnBC 10 "" <password> | tr -d ':\n'
    hash: "$2y$10$REPLACE_WITH_YOUR_OWN_BCRYPT_HASH"
    username: "admin"
    userID: "08a8684b-db88-4b73-90a9-3cd1661f5466"
